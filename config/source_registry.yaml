sources:
  simplifi:
    loader: finance_pipeline.loaders.simplifi
    output: transactions
    default_path: data/raw/simplifi/
  amazon_order_history_reporter:
    loader: finance_pipeline.loaders.amazon_order_history_reporter
    output: retail_items
    retailer: amazon
    default_path: data/raw/amazon/amazon_order_history_reporter/
  store_receipt_extract:
    loader: finance_pipeline.loaders.store_receipt_extract
    output: retail_items
    default_path: data/raw/store_receipt_extract/

reconciliation:
  date_window_days: 5
  amount_tolerance: 0.03
  match_amount_tolerance: 0.05
  amazon_extended_date_window_days: 10
  amazon_extended_date_min_amount: 10.00
